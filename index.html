<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protect Mandalorian &amp; Grogu</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050a14'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%238fe3ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <section id="leaderboard-modal" class="leaderboard-modal" hidden>
      <div class="leaderboard-card" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title">
        <button id="leaderboard-close" class="leaderboard-close" type="button" aria-label="Close leaderboard">×</button>
        <h1 id="leaderboard-title">LEADERBOARD</h1>
        <div id="leaderboard-body"></div>
        <form id="pilot-name-form" class="pilot-name-form">
          <label for="pilot-name">PILOT NAME</label>
          <input id="pilot-name" name="pilotName" maxlength="16" autocomplete="nickname" placeholder="Enter your name" hidden />
          <button type="submit">SAVE NAME</button>
        </form>
      </div>
    </section>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
